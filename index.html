<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FATUR ARCHIVE • Curated Digital Ecosystem</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #08070b;
      --gold-gradient: linear-gradient(135deg, #dfba73 0%, #c59b4e 50%, #9a742c 100%);
      --gold-light: #f5e4b8;
      --gold-border: rgba(223, 186, 115, 0.25);
      --gold-glow: rgba(218, 165, 32, 0.15);
      --glass-bg: rgba(20, 18, 26, 0.65);
      --glass-card: rgba(26, 23, 34, 0.45);
      --glass-border: rgba(255, 255, 255, 0.08);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; position: relative; }

    .ambient-glow { position: fixed; width: 500px; height: 500px; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(120px); opacity: 0.28; }
    .glow-1 { top: -100px; left: 10%; background: radial-gradient(circle, #dfba73, transparent 70%); }
    .glow-2 { top: 40%; right: -50px; background: radial-gradient(circle, #7e52a0, transparent 70%); }
    .glow-3 { bottom: -100px; left: 30%; background: radial-gradient(circle, #c59b4e, transparent 70%); }

    .container { width: min(1200px, 92%); margin: 0 auto; position: relative; z-index: 1; padding: 3rem 0 6rem; }
    header { text-align: center; padding: 4rem 1rem 2rem; }

    .brand-badge {
      display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px;
      border-radius: 999px; background: rgba(223, 186, 115, 0.08); border: 1px solid var(--gold-border);
      color: var(--gold-light); font-size: 0.8rem; letter-spacing: 2px; text-transform: uppercase;
      margin-bottom: 1.5rem; box-shadow: 0 0 20px var(--gold-glow);
    }
    .brand-dot { width: 6px; height: 6px; border-radius: 50%; background: #dfba73; box-shadow: 0 0 8px #dfba73; }

    h1.luxury-title {
      font-family: 'Cinzel', serif; font-size: clamp(2.4rem, 6vw, 4.5rem); font-weight: 900;
      letter-spacing: 3px; background: linear-gradient(180deg, #ffffff 20%, #dfba73 70%, #9a742c 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; line-height: 1.15;
      margin-bottom: 0.8rem; text-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
    }

    /* Identitas Developer fatur62 dengan Animasi Kelap-Kelip */
    .developer-badge {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      gap: 9px;
      margin: 0.5rem auto 1.5rem;
      padding: 6px 18px;
      background: rgba(15, 13, 20, 0.7);
      border: 1px solid rgba(223, 186, 115, 0.2);
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      color: #e5e7eb;
      letter-spacing: 1.5px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    .dev-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6cff83;
      box-shadow: 0 0 10px #6cff83;
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      0%, 100% {
        opacity: 1;
        transform: scale(1);
      }
      50% {
        opacity: 0.25;
        transform: scale(0.65);
      }
    }

    .hero-subtitle { color: var(--text-muted); font-size: clamp(1rem, 2vw, 1.2rem); max-width: 680px; margin: 0 auto; font-weight: 300; line-height: 1.6; }

    .controls-wrapper {
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 20px; padding: 1.25rem;
      margin: 2.5rem auto 3rem; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      display: flex; flex-direction: column; gap: 1.25rem;
    }

    .search-bar { position: relative; display: flex; align-items: center; }
    .search-icon { position: absolute; left: 1.2rem; font-size: 1.1rem; color: var(--gold-light); pointer-events: none; }
    .search-input {
      width: 100%; padding: 1rem 1rem 1rem 3.2rem; background: rgba(10, 8, 14, 0.7);
      border: 1px solid var(--glass-border); border-radius: 14px; color: #fff; font-size: 1rem;
      outline: none; transition: all 0.3s;
    }
    .search-input:focus { border-color: #dfba73; box-shadow: 0 0 15px var(--gold-glow); }

    .filter-tags { display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center; }
    .filter-btn {
      background: rgba(255, 255, 255, 0.04); color: var(--text-muted); border: 1px solid var(--glass-border);
      padding: 0.5rem 1.1rem; border-radius: 999px; font-size: 0.85rem; font-weight: 500; cursor: pointer; transition: all 0.3s;
    }
    .filter-btn:hover { color: #fff; border-color: rgba(223, 186, 115, 0.4); }
    .filter-btn.active {
      background: var(--gold-gradient); color: #0d0b11; font-weight: 700; border-color: transparent;
      box-shadow: 0 4px 15px rgba(223, 186, 115, 0.35);
    }

    .apps-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; padding: 0 0.5rem; }
    .counter-text { color: var(--gold-light); font-size: 0.9rem; letter-spacing: 1px; }

    .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1.75rem; }
    .app-card {
      background: var(--glass-card); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: 24px; padding: 1.75rem;
      display: flex; flex-direction: column; justify-content: space-between;
      position: relative; overflow: hidden; transition: all 0.35s;
    }
    .app-card:hover {
      transform: translateY(-6px); border-color: var(--gold-border);
      box-shadow: 0 16px 35px rgba(0, 0, 0, 0.6), 0 0 25px var(--gold-glow);
    }

    .card-top { display: flex; align-items: flex-start; gap: 1.25rem; margin-bottom: 1.25rem; }
    .app-icon {
      width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, #24202d, #14121a);
      border: 1px solid var(--gold-border); display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4); flex-shrink: 0;
    }

    .app-meta h2 { font-size: 1.25rem; font-weight: 700; color: #ffffff; margin-bottom: 0.3rem; }
    .category-badge { font-size: 0.75rem; font-weight: 600; color: var(--gold-light); text-transform: uppercase; letter-spacing: 1px; }
    .app-desc { color: var(--text-muted); font-size: 0.92rem; line-height: 1.6; margin-bottom: 1.5rem; flex-grow: 1; }

    .tech-stack { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem; }
    .tech-tag {
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.06);
      color: #d1d5db; font-size: 0.72rem; padding: 0.25rem 0.6rem; border-radius: 6px; font-weight: 500;
    }

    .card-action { display: flex; gap: 0.75rem; margin-top: auto; }

    /* Tombol Utama dengan Efek Kilau Mengalir (Shimmer) */
    .btn-launch {
      flex: 1;
      position: relative;
      overflow: hidden;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0.8rem 1.2rem;
      background: var(--gold-gradient);
      color: #0b090f;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(223, 186, 115, 0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
    }

    .btn-launch::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -150%;
      width: 50%;
      height: 200%;
      background: linear-gradient(
        90deg,
        transparent 0%,
        rgba(255, 255, 255, 0.5) 50%,
        transparent 100%
      );
      transform: rotate(25deg);
      animation: shimmerSweep 3.5s infinite ease-in-out;
      pointer-events: none;
    }

    @keyframes shimmerSweep {
      0% {
        left: -150%;
      }
      30% {
        left: 200%;
      }
      100% {
        left: 200%;
      }
    }

    .btn-launch:hover {
      box-shadow: 0 6px 20px rgba(223, 186, 115, 0.4);
      filter: brightness(1.08);
    }

    .btn-launch:active {
      transform: scale(0.98);
    }

    .btn-details {
      padding: 0.8rem; background: rgba(255, 255, 255, 0.06); border: 1px solid var(--glass-border);
      color: #ffffff; border-radius: 12px; cursor: pointer; transition: all 0.2s;
    }
    .btn-details:hover { background: rgba(255, 255, 255, 0.12); }

    .empty-state {
      grid-column: 1 / -1; text-align: center; padding: 4rem 1rem;
      background: var(--glass-card); border-radius: 20px; border: 1px solid var(--glass-border); color: var(--text-muted);
    }

    /* Modal */
    .modal-backdrop {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(10px); z-index: 999; display: none; align-items: center; justify-content: center; padding: 1.5rem;
    }
    .modal-backdrop.active { display: flex; }
    .modal-box {
      background: #15131c; border: 1px solid var(--gold-border); border-radius: 24px;
      max-width: 600px; width: 100%; padding: 2.2rem; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9); position: relative;
    }
    .modal-close {
      position: absolute; top: 1.2rem; right: 1.2rem; background: rgba(255, 255, 255, 0.06);
      border: none; color: #ffffff; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-size: 1.2rem;
    }

    footer { border-top: 1px solid var(--glass-border); text-align: center; padding: 3rem 1rem; color: var(--text-muted); font-size: 0.85rem; margin-top: 5rem; }
    footer span.brand-gold { color: var(--gold-light); font-weight: 600; }
  </style>
</head>
<body>

  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <div class="container">
    <header>
      <div class="brand-badge">
        <span class="brand-dot"></span>
        Personal Software Suite
      </div>
      
      <h1 class="luxury-title">THE MASTERPIECE VAULT</h1>

      <!-- Identitas Developer fatur62 -->
      <div class="developer-badge">
        <span class="dev-dot"></span>
        <span>developer : fatur62</span>
      </div>

      <p class="hero-subtitle">Galeri portofolio kurasi aplikasi digital pintar dan utilitas eksklusif karya fatur62.</p>
    </header>

    <section class="controls-wrapper">
      <div class="search-bar">
        <span class="search-icon">✧</span>
        <input type="text" id="searchInput" class="search-input" placeholder="Cari nama aplikasi, modul, atau teknologi...">
      </div>
      <div class="filter-tags" id="categoryFilters">
        <button class="filter-btn active" data-category="Semua">Semua Kreasi</button>
        <button class="filter-btn" data-category="Lifestyle & Rumah">Lifestyle & Rumah</button>
        <button class="filter-btn" data-category="Produktivitas">Produktivitas</button>
        <button class="filter-btn" data-category="Keuangan">Keuangan</button>
        <button class="filter-btn" data-category="Utilitas & Tools">Utilitas & Tools</button>
      </div>
    </section>

    <div class="apps-header">
      <span class="counter-text" id="appCounter">Memuat koleksi...</span>
    </div>

    <main class="grid-container" id="appsGrid"></main>
  </div>

  <div class="modal-backdrop" id="appModal">
    <div class="modal-box">
      <button class="modal-close" id="closeModalBtn">&times;</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <footer>
    <p>© 2026 <span class="brand-gold">FATUR ARCHIVE</span> • Crafted with Architectural Precision by <strong>fatur62</strong></p>
  </footer>

  <script>
    const SUPABASE_URL = "https://ooifnjchlhccicqedgie.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UT-t39AXZSklzRcPn3AwMA_uGb1XZA9";

    let allApps = [];
    let currentCategory = "Semua";

    async function loadAppsData() {
      try {
        const response = await fetch(`${SUPABASE_URL}/rest/v1/apps?select=*&order=id.desc`, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${SUPABASE_KEY}`
          }
        });

        if (!response.ok) throw new Error("Gagal mengambil data dari database");
        const rawData = await response.json();

        allApps = (Array.isArray(rawData) ? rawData : []).map(item => ({
          id: String(item.id),
          name: item.name || "Tanpa Judul",
          category: item.category || "Umum",
          icon: item.icon || "✨",
          desc: item.description || "",
          url: item.url || "#",
          tech: item.tech ? item.tech.split(",").map(t => t.trim()).filter(Boolean) : [],
          features: item.features ? item.features.split("\n").map(f => f.trim()).filter(Boolean) : []
        }));

        filterAndRender();
      } catch (err) {
        console.error("Fetch error:", err);
        document.getElementById("appsGrid").innerHTML = `
          <div class="empty-state">
            <p>Gagal memuat katalog dari database online.</p>
          </div>
        `;
      }
    }

    function renderApps(apps) {
      const grid = document.getElementById("appsGrid");
      const counter = document.getElementById("appCounter");
      if (!grid || !counter) return;

      grid.innerHTML = "";
      counter.textContent = `Menampilkan ${apps.length} Karya Aplikasi`;

      if (apps.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <p>Tidak ada aplikasi yang cocok dengan pencarian.</p>
          </div>
        `;
        return;
      }

      apps.forEach(app => {
        const card = document.createElement("article");
        card.className = "app-card";

        const techBadges = (app.tech || [])
          .map(t => `<span class="tech-tag">${t}</span>`)
          .join("");

        card.innerHTML = `
          <div>
            <div class="card-top">
              <div class="app-icon">${app.icon || "✨"}</div>
              <div class="app-meta">
                <h2>${app.name}</h2>
                <span class="category-badge">${app.category}</span>
              </div>
            </div>
            <p class="app-desc">${app.desc}</p>
            <div class="tech-stack">${techBadges}</div>
          </div>
          <div class="card-action">
            <a href="${app.url}" class="btn-launch" target="_blank" rel="noopener">Buka Aplikasi ↗</a>
            <button class="btn-details" onclick="openDetails('${app.id}')" title="Detail Fitur">ℹ</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterAndRender() {
      const searchInput = document.getElementById("searchInput");
      const query = searchInput ? searchInput.value.toLowerCase().trim() : "";

      const filtered = allApps.filter(app => {
        const matchCategory = currentCategory === "Semua" || app.category === currentCategory;
        const matchSearch = 
          (app.name && app.name.toLowerCase().includes(query)) ||
          (app.desc && app.desc.toLowerCase().includes(query)) ||
          (app.tech && app.tech.some(t => t.toLowerCase().includes(query)));

        return matchCategory && matchSearch;
      });

      renderApps(filtered);
    }

    function openDetails(appId) {
      const target = allApps.find(a => a.id === appId);
      if (!target) return;

      const modal = document.getElementById("appModal");
      const content = document.getElementById("modalContent");

      const featuresHtml = (target.features || [])
        .map(f => `<li style="margin-bottom: 0.5rem; color: #d1d5db;">✦ ${f}</li>`)
        .join("");

      content.innerHTML = `
        <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem;">
          <div class="app-icon">${target.icon}</div>
          <div>
            <h2 style="color: #fff; font-size: 1.4rem;">${target.name}</h2>
            <span class="category-badge">${target.category}</span>
          </div>
        </div>
        <p style="color: var(--text-muted); line-height: 1.6; margin-bottom: 1.5rem;">${target.desc}</p>
        <h4 style="color: var(--gold-light); margin-bottom: 0.75rem; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px;">Fitur Utama:</h4>
        <ul style="list-style: none; margin-bottom: 2rem;">${featuresHtml}</ul>
        <a href="${target.url}" class="btn-launch" target="_blank" rel="noopener" style="width: 100%; text-align: center;">Jalankan Sekarang</a>
      `;

      modal.classList.add("active");
    }

    document.addEventListener("DOMContentLoaded", () => {
      loadAppsData();

      const searchInput = document.getElementById("searchInput");
      if (searchInput) {
        searchInput.addEventListener("input", filterAndRender);
      }

      const filterButtons = document.querySelectorAll(".filter-btn");
      filterButtons.forEach(btn => {
        btn.addEventListener("click", () => {
          filterButtons.forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentCategory = btn.getAttribute("data-category") || "Semua";
          filterAndRender();
        });
      });

      const modal = document.getElementById("appModal");
      const closeBtn = document.getElementById("closeModalBtn");
      
      if (closeBtn && modal) {
        closeBtn.addEventListener("click", () => modal.classList.remove("active"));
        modal.addEventListener("click", (e) => {
          if (e.target === modal) modal.classList.remove("active");
        });
      }
    });
  </script>
</body>
</html>
