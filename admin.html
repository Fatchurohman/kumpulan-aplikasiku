<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel • Kelola Portfolio Aplikasi</title>
  <style>
    :root {
      --bg: #0b090f;
      --card-bg: #15121e;
      --gold: #dfba73;
      --gold-hover: #c59b4e;
      --border: #262135;
      --text: #f3f4f6;
      --muted: #9ca3af;
      --danger: #ef4444;
      --edit: #3b82f6;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 2rem 1rem; min-height: 100vh; }
    .container { max-width: 960px; margin: 0 auto; }

    #authGate {
      max-width: 360px; margin: 6rem auto; background: var(--card-bg); padding: 2.5rem 2rem;
      border-radius: 18px; border: 1px solid var(--border); text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    .dashboard { display: none; }
    .dashboard.active { display: block; }

    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 2rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;
      gap: 1rem;
    }
    
    .header-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    
    header h1 { font-size: 1.4rem; color: var(--gold); }

    .developer-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-weight: 600;
      color: #9ca3af;
      letter-spacing: 1px;
    }

    .dev-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6cff83;
      box-shadow: 0 0 8px #6cff83;
      animation: blink 1.1s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.25; transform: scale(0.65); }
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 0.6rem;
    }

    .btn-view-site {
      background: linear-gradient(135deg, #dfba73, #c59b4e);
      color: #0b090f;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }
    .btn-view-site:hover {
      filter: brightness(1.1);
      box-shadow: 0 0 12px rgba(223, 186, 115, 0.4);
    }

    .card {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem;
    }

    .form-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; margin-top: 1rem;
    }
    .full-width { grid-column: span 2; }

    label { display: block; font-size: 0.85rem; color: var(--muted); margin-bottom: 0.35rem; }
    input, select, textarea {
      width: 100%; padding: 0.75rem 1rem; background: #08070b; border: 1px solid var(--border);
      border-radius: 8px; color: #fff; font-size: 0.95rem; outline: none; transition: 0.2s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--gold); }
    textarea { resize: vertical; min-height: 80px; }

    .btn-group { display: flex; gap: 0.75rem; margin-top: 1.25rem; }
    .btn {
      background: var(--gold); color: #000; border: none; padding: 0.75rem 1.5rem;
      border-radius: 8px; font-weight: 700; cursor: pointer; transition: 0.2s;
    }
    .btn:hover { background: var(--gold-hover); }
    .btn-cancel { background: #374151; color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 0.5rem 0.9rem; font-size: 0.8rem; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
    .btn-edit { background: var(--edit); color: #fff; }

    .app-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 1.2rem 0; border-bottom: 1px solid var(--border); gap: 1rem;
    }
    .app-item:last-child { border-bottom: none; }
    .app-meta h3 { font-size: 1.1rem; color: #fff; margin-bottom: 0.2rem; }
    .app-meta p { font-size: 0.85rem; color: var(--muted); }
    .actions { display: flex; gap: 0.5rem; flex-shrink: 0; }

    @media (max-width: 640px) {
      header { flex-direction: column; align-items: flex-start; }
      .header-actions { width: 100%; justify-content: space-between; margin-top: 0.5rem; }
      .form-grid { grid-template-columns: 1fr; }
      .full-width { grid-column: span 1; }
      .app-item { flex-direction: column; align-items: flex-start; }
      .actions { width: 100%; justify-content: flex-end; }
    }
  </style>
</head>
<body>

  <div class="container">
    <div id="authGate">
      <h2 style="color: var(--gold); margin-bottom: 0.5rem;">Admin Access</h2>
      <div class="developer-badge" style="margin-bottom: 1.5rem; justify-content: center;">
        <span class="dev-dot"></span>
        <span>developer : fatur62</span>
      </div>
      <input type="password" id="pinInput" placeholder="Masukkan PIN Rahasia" style="text-align: center; margin-bottom: 1rem;">
      <button class="btn" style="width: 100%;" onclick="verifyPin()">Buka Panel</button>
    </div>

    <div class="dashboard" id="mainDashboard">
      <header>
        <div class="header-left">
          <h1>⚡ Admin Manager • Portfolio Aplikasi</h1>
          <div class="developer-badge">
            <span class="dev-dot"></span>
            <span>developer : fatur62</span>
          </div>
        </div>
        
        <!-- Action Header: Tombol Langsung ke Web Utama & Logout -->
        <div class="header-actions">
          <a href="index.html" class="btn-view-site" target="_blank" title="Lihat Tampilan Web Publik">
            🌐 Lihat Web Utama ↗
          </a>
          <button class="btn-sm btn-danger" onclick="logout()">Logout</button>
        </div>
      </header>

      <div class="card">
        <h2 id="formTitle" style="font-size: 1.2rem; color: var(--gold);">Tambah Aplikasi Baru</h2>
        <form id="appForm">
          <input type="hidden" id="editAppId" value="">
          
          <div class="form-grid">
            <div>
              <label>Nama Aplikasi</label>
              <input type="text" id="appName" placeholder="Contoh: DAPURKU" required>
            </div>
            <div>
              <label>Kategori</label>
              <select id="appCategory" required>
                <option value="Lifestyle & Rumah">Lifestyle & Rumah</option>
                <option value="Produktivitas">Produktivitas</option>
                <option value="Keuangan">Keuangan</option>
                <option value="Utilitas & Tools">Utilitas & Tools</option>
              </select>
            </div>
            <div>
              <label>Ikon Emoji</label>
              <input type="text" id="appIcon" placeholder="Contoh: 🍳" required>
            </div>
            <div>
              <label>Link URL Aplikasi</label>
              <input type="url" id="appUrl" placeholder="https://username.github.io/dapurku/" required>
            </div>
            <div class="full-width">
              <label>Tech Stack (Pisahkan dengan koma)</label>
              <input type="text" id="appTech" placeholder="HTML5, CSS Grid, Vanilla JS, LocalStorage" required>
            </div>
            <div class="full-width">
              <label>Deskripsi Singkat</label>
              <textarea id="appDesc" placeholder="Jelaskan fungsi aplikasi..." required></textarea>
            </div>
            <div class="full-width">
              <label>Daftar Fitur (Satu fitur per baris)</label>
              <textarea id="appFeatures" placeholder="Pencarian resep bahan sisa&#10;Perencana menu 7 hari&#10;Kalkulator belanja" required></textarea>
            </div>
          </div>

          <div class="btn-group">
            <button type="submit" class="btn" id="submitBtn">+ Simpan Aplikasi</button>
            <button type="button" class="btn btn-cancel" id="cancelEditBtn" style="display: none;" onclick="cancelEditMode()">Batal Edit</button>
          </div>
        </form>
      </div>

      <div class="card">
        <h2 style="font-size: 1.2rem; margin-bottom: 1rem;">Daftar Semua Aplikasi</h2>
        <div id="appsListContainer">Memuat data...</div>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://ooifnjchlhccicqedgie.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UT-t39AXZSklzRcPn3AwMA_uGb1XZA9";
    const ADMIN_PIN = "123456";

    const apiHeaders = {
      "apikey": SUPABASE_KEY,
      "Authorization": `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=representation"
    };

    let cachedApps = [];

    function verifyPin() {
      const pin = document.getElementById("pinInput").value;
      if (pin === ADMIN_PIN) {
        document.getElementById("authGate").style.display = "none";
        document.getElementById("mainDashboard").classList.add("active");
        loadApps();
      } else {
        alert("PIN Rahasia Salah!");
      }
    }

    function logout() {
      location.reload();
    }

    async function loadApps() {
      const container = document.getElementById("appsListContainer");
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/apps?select=*&order=id.desc`, { headers: apiHeaders });
        if (!res.ok) throw new Error("Gagal mengambil data");
        cachedApps = await res.json();

        if (cachedApps.length === 0) {
          container.innerHTML = "<p style='color: var(--muted);'>Belum ada aplikasi yang dimasukkan.</p>";
          return;
        }

        container.innerHTML = cachedApps.map(app => `
          <div class="app-item">
            <div class="app-meta">
              <h3>${app.icon || '📱'} ${app.name}</h3>
              <p>${app.category} • <a href="${app.url}" target="_blank" style="color: var(--gold);">${app.url}</a></p>
            </div>
            <div class="actions">
              <button class="btn-sm btn-edit" onclick="setEditMode(${app.id})">Edit</button>
              <button class="btn-sm btn-danger" onclick="deleteApp(${app.id})">Hapus</button>
            </div>
          </div>
        `).join("");
      } catch (err) {
        container.innerHTML = `<p style="color: var(--danger);">Gagal memuat: ${err.message}</p>`;
      }
    }

    function setEditMode(id) {
      const app = cachedApps.find(a => a.id === id);
      if (!app) return;

      document.getElementById("editAppId").value = app.id;
      document.getElementById("appName").value = app.name || "";
      document.getElementById("appCategory").value = app.category || "Lifestyle & Rumah";
      document.getElementById("appIcon").value = app.icon || "";
      document.getElementById("appUrl").value = app.url || "";
      document.getElementById("appTech").value = app.tech || "";
      document.getElementById("appDesc").value = app.description || "";
      document.getElementById("appFeatures").value = app.features || "";

      document.getElementById("formTitle").textContent = "✏️ Edit Aplikasi: " + app.name;
      document.getElementById("submitBtn").textContent = "Update Perubahan";
      document.getElementById("cancelEditBtn").style.display = "inline-block";

      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function cancelEditMode() {
      document.getElementById("appForm").reset();
      document.getElementById("editAppId").value = "";
      document.getElementById("formTitle").textContent = "Tambah Aplikasi Baru";
      document.getElementById("submitBtn").textContent = "+ Simpan Aplikasi";
      document.getElementById("cancelEditBtn").style.display = "none";
    }

    document.getElementById("appForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const editId = document.getElementById("editAppId").value;

      const payload = {
        name: document.getElementById("appName").value.trim(),
        category: document.getElementById("appCategory").value,
        icon: document.getElementById("appIcon").value.trim(),
        url: document.getElementById("appUrl").value.trim(),
        tech: document.getElementById("appTech").value.trim(),
        description: document.getElementById("appDesc").value.trim(),
        features: document.getElementById("appFeatures").value.trim()
      };

      try {
        let res;
        if (editId) {
          res = await fetch(`${SUPABASE_URL}/rest/v1/apps?id=eq.${editId}`, {
            method: "PATCH",
            headers: apiHeaders,
            body: JSON.stringify(payload)
          });
        } else {
          res = await fetch(`${SUPABASE_URL}/rest/v1/apps`, {
            method: "POST",
            headers: apiHeaders,
            body: JSON.stringify(payload)
          });
        }

        if (!res.ok) {
          const errorBody = await res.json().catch(() => ({}));
          throw new Error(errorBody.message || `Status HTTP ${res.status}`);
        }

        const successMsg = editId ? "✅ Perubahan berhasil disimpan!" : "✅ Aplikasi baru berhasil ditambahkan!";
        
        // Konfirmasi cepat: Tanya apakah ingin langsung membuka halaman utama
        if (confirm(`${successMsg}\n\nIngin langsung membuka halaman utama (index.html) sekarang?`)) {
          window.open("index.html", "_blank");
        }

        cancelEditMode();
        loadApps();
      } catch (err) {
        alert("Gagal simpan: " + err.message);
      }
    });

    async function deleteApp(id) {
      if (!confirm("Yakin ingin menghapus aplikasi ini dari katalog?")) return;

      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/apps?id=eq.${id}`, {
          method: "DELETE",
          headers: apiHeaders
        });

        if (!res.ok) throw new Error("Gagal menghapus data");

        loadApps();
      } catch (err) {
        alert("Gagal hapus: " + err.message);
      }
    }
  </script>
</body>
</html>
